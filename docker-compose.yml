services:
  db:
    image: timescale/timescaledb-ha:pg17
    container_name: trainlab-db
    environment:
      POSTGRES_USER: trainlab
      POSTGRES_PASSWORD: trainlab_dev_pw
      POSTGRES_DB: trainlab
    ports:
      - "5433:5432"
    volumes:
      - db-data:/home/postgres/pgdata
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trainlab -d trainlab"]
      interval: 5s
      retries: 10

  seq:
    image: datalust/seq:latest
    container_name: trainlab-seq
    environment:
      ACCEPT_EULA: "Y"
      SEQ_FIRSTRUN_NOAUTHENTICATION: "true"
    ports:
      - "5341:5341"
      - "8082:80"

volumes:
  db-data:
