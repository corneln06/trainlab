services:
  db:
    image: timescale/timescaledb-ha:pg17
    container_name: trainlab-db
    environment:
      POSTGRES_USER: trainlab
      POSTGRES_PASSWORD: trainlab_dev_pw
      POSTGRES_DB: trainlab
    ports:
      - "5433:5432"
    volumes:
      - db-data:/home/postgres/pgdata
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trainlab -d trainlab"]
      interval: 5s
      retries: 10

  seq:
    image: datalust/seq:latest
    container_name: trainlab-seq
    environment:
      ACCEPT_EULA: "Y"
      SEQ_FIRSTRUN_NOAUTHENTICATION: "true"
    ports:
      - "5341:5341"
      - "8082:80"
    
  app:
    build: .
    profiles: [ "full" ]
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: "Host=db;Port=5432;Database=trainlab;Username=trainlab;Password=trainlab_dev_pw"
      Storage__RootPath: /data/storage
      Serilog__WriteTo__1__Args__serverUrl: http://seq:5341
    ports:
      - "8080:8080"
    volumes:
      - storage-data:/data/storage

volumes:
  db-data:
  storage-data:
